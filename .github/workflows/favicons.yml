name: Favicons

# Fetches or refreshes cached tool favicons and proposes them in a pull request.
#
# This workflow is intentionally independent from normal CI and Pages deploy:
# it is the only place that performs favicon network fetching. Pull requests do
# not fetch favicons.
on:
  # After a tools change lands on main: fetch only missing favicons.
  push:
    branches:
      - main
    paths:
      - data/tools.yaml

  # Conservative periodic refresh: re-fetch existing favicons and open a PR
  # only if the tracked assets actually changed. First day of the month, 04:00 UTC.
  schedule:
    - cron: '0 4 1 * *'

  # Manual run by a maintainer.
  workflow_dispatch:
    inputs:
      mode:
        description: Favicon run mode
        type: choice
        options:
          - missing-only
          - refresh-all
        default: missing-only

# Least privilege: read repo, push the automation branch, open/update the PR.
permissions:
  contents: write
  pull-requests: write

# Never let two favicon runs race on the same branch/PR.
concurrency:
  group: favicons
  cancel-in-progress: false

jobs:
  favicons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Select favicon run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "refresh-all" ]; then
            echo "target=favicons-refresh" >> "$GITHUB_OUTPUT"
            echo "label=refresh-all" >> "$GITHUB_OUTPUT"
            echo "title=chore: refresh tool favicons" >> "$GITHUB_OUTPUT"
          else
            echo "target=favicons" >> "$GITHUB_OUTPUT"
            echo "label=missing-only" >> "$GITHUB_OUTPUT"
            echo "title=chore: add missing tool favicons" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch favicons (${{ steps.mode.outputs.label }})
        run: make ${{ steps.mode.outputs.target }}

      - name: Remove leftover temp files
        run: find site/assets/favicons -name '*.tmp' -type f -delete 2>/dev/null || true

      - name: Count changed favicons
        id: changed
        run: |
          count=$(git status --porcelain=v1 -- site/assets/favicons | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Open or update favicon pull request
        if: steps.changed.outputs.count != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Stable branch: an existing automation PR is updated in place instead
          # of creating a new one every run.
          branch: automation/update-favicons
          delete-branch: true
          base: main
          # Only favicon assets may enter the commit.
          add-paths: site/assets/favicons
          commit-message: "chore: update tool favicons"
          title: ${{ steps.mode.outputs.title }}
          body: |
            Automated favicon update.

            - Run type: `${{ steps.mode.outputs.label }}`
            - Changed favicon files: ${{ steps.changed.outputs.count }}
            - Generated by the `Favicons` workflow from `data/tools.yaml`.

            Do not edit these files by hand; they are refreshed automatically.
