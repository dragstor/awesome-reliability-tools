:root {
  --bprogress-color: #555;
  --bprogress-height: 2px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px #555, 0 0 5px #555;
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  width: 0;
  height: 0;
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}
</style><!--$?--><template id="B:1"></template><!--/$--><section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></section><!--$?--><template id="B:3"></template><!--&--><!--$--><div></div><!--$?--><template id="B:19"></template><!--/$--><div class="flex flex-col min-h-dvb h-dvh max-h-dvh font-sans leading-tight bg-black md:flex-row md:bg-[#f6f7f9] dark:bg-black overflow-x-clip"><div class="sticky top-0 z-50 sidebar-shell shrink-0 min-h-svh max-h-svh transition-[width] duration-[250ms] ease-[cubic-bezier(0.22,1,0.36,1)] w-48"><button type="button" aria-label="Collapse sidebar" aria-expanded="true" class="group absolute top-[5.5rem] bottom-0 z-[60] w-3 -translate-x-1/2 transition-[left] duration-[250ms] ease-[cubic-bezier(0.22,1,0.36,1)] left-[12rem] cursor-w-resize"><span class="absolute inset-y-0 left-1/2 w-px bg-transparent -translate-x-1/2 group-hover:bg-gray-300 dark:group-hover:bg-gray-800"></span></button><div class="sidebar-panel absolute inset-y-0 left-0 flex w-48 flex-col gap-5 overflow-x-hidden border-r px-4 pt-[9px] pb-6 font-medium text-sm tracking-[-0.0075em] bg-[#f6f7f9] dark:bg-black transition-[width,padding,border-color,box-shadow] [&amp;_.sidebar-label]:transition-opacity [&amp;_.sidebar-label]:duration-[150ms] [&amp;_.sidebar-submarker]:transition-opacity [&amp;_.sidebar-submarker]:duration-[150ms] [&amp;_.sidebar-item]:transition-[width,margin] [&amp;_.sidebar-icon]:transition-[margin] [&amp;_.sidebar-subitem]:transition-[width] duration-[250ms] ease-[cubic-bezier(0.22,1,0.36,1)] [&amp;_.sidebar-item]:duration-[250ms] [&amp;_.sidebar-item]:ease-[cubic-bezier(0.22,1,0.36,1)] [&amp;_.sidebar-icon]:duration-[250ms] [&amp;_.sidebar-icon]:ease-[cubic-bezier(0.22,1,0.36,1)] [&amp;_.sidebar-subitem]:duration-[250ms] [&amp;_.sidebar-subitem]:ease-[cubic-bezier(0.22,1,0.36,1)] border-transparent shadow-none"><div class="flex relative z-10 items-center h-9"><!--$?--><template id="B:1a"></